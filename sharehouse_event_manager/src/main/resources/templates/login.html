<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ログイン画面</title>
    <link href="css/styles.css" rel="stylesheet">

</head>


<body>

  <h3>ログイン画面</h3>

    <p th:if="${errMsg}" th:text="${errMsg}" class="error">エラーメッセージ</p>
    <p th:if="${session.loginError}" class="error">エラーメッセージ</p>

  <form action="myPage" method="post" th:object="${loginForm}">
    <fieldset>
      <div>
        <label>Username:</label>
        <input type="text" th:field="*{userName}">
        <span th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="error">エラーメッセージ</span>
      </div>
      <div>
        <label>Password:</label>
        <input type="password" th:field="*{password}">
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"  class="error">エラーメッセージ</span>
      </div>
    </fieldset>
    
    <div class="button">
    <button>ログイン</button>
  </form>

  <form action="index" method="get">
        <button>戻る</button>
    </form>

    </div>

</body>









</html>
