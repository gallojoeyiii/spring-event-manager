<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>イベントフォーム</title>
    <link href="css/styles.css" rel="stylesheet">
    <script src="js/script.js"></script>
</head>


<body>
    
    <h3>イベントの作成/編集の画面</h3>
    <p th:if="${errMsg}" th:text="${errMsg}" class="error">エラーメッセージ</p>
    <form th:action="@{/eventForm}" method="post" th:object="${eventForm}">
        <fieldset>
            <div>
                <label>タイトル:</label>
                <input type="text" th:field="*{title}">
                <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error">エラーメッセージ</span>
            </div>
            <div>
                <label>カテゴリ:</label>
                <input type="text" th:field="*{category}">
                <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="error">エラーメッセージ</span>
            </div>

            <div>
                <label>開催日:</label>
                <input type="text" th:field="*{eventDate}">
                <span th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" class="error">エラーメッセージ</span>
            </div>

            <div>
                <label>場所:</label>
                <input type="text" th:field="*{location}">
                <span th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="error">エラーメッセージ</span>
            </div>

            <div>
                <label>定員:</label>
                <input type="text" th:field="*{capacity}">
                <span th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}" class="error">エラーメッセージ</span>
            </div>

            <div>
                <label>詳細:</label>
                <input type="text" th:field="*{description}">
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error">エラーメッセージ</span>
            </div>
        </fieldset>
        <button type="submit" id="delete" onclick="return confirmSave()" >イベント保存</button>
    </form>

    <br>
    <form action="eventList" method="get">
        <button>戻る</button>
    </form>

</body>









</html>
