<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>イベント詳細</title>
    <link href="css/styles.css" rel="stylesheet">
    <script src="js/script.js"></script>

</head>


<body>
  <h3>イベントに参加か出るの画面</h3>


    <div th:if="${id}">
      <form th:action="@{/process-user-action}" method="post">
        <table border="1">
      <caption>イベント</caption>
      <thead>
        <tr>
          <th>タイトル</th>
          <th>カテゴリ</th>
          <th>開催日</th>
          <th>場所</th>
          <th>参加人数</th>
          <th>定員</th>
          <th>詳細</th>
        </tr>
      </thead>
      <tbody>
          <td th:text="${mySelectedEvent.getTitle}">id01</td>
          <td th:text="${mySelectedEvent.getCategory}">〇〇</td>
          <td th:text="${#temporals.format(mySelectedEvent.getEventDate, 'yyyy-MM-dd HH:mm')}">管理者</td>
          <td th:text="${mySelectedEvent.getLocation}">2025/12/11</td>
          <td th:text="${mySelectedEvent.getParticipantCount}">2025/12/11</td>
          <td th:text="${mySelectedEvent.getCapacity}">2025/12/12</td>
          <td th:text="${mySelectedEvent.getDescription}">2025/12/12</td>
        </tr>
      </tbody>
    </table>
    
    <div class="button">
    <button type="submit" name="userAction" value="join" id="join" onclick="return confirmJoin()">イベントに入る</button>
    <button type="submit" name="userAction" value="leave" id="leave" onclick="return confirmLeave()">イベントに出る</button></div>
    <div th:if="${session.joinError}" th:text="${session.joinError}" class="error">エラーメッセージ</div>
    </form>


    </div>

    <div th:unless="${id}">

      <form th:action="@{/process-user-action}" method="post">
        <table border="1">
      <caption>イベントリスト</caption>
      <thead>
        <tr>
  
          <th>タイトル</th>
          <th>カテゴリ</th>
          <th>開催日</th>
          <th>場所</th>
          <th>参加人数</th>
          <th>定員</th>
          <th>詳細</th>
        </tr>
      </thead>
      <tbody>
          <td th:text="${selectedEvent.getTitle}">id01</td>
          <td th:text="${selectedEvent.getCategory}">〇〇</td>
          <td th:text="${#temporals.format(selectedEvent.getEventDate, 'yyyy-MM-dd HH:mm')}">管理者</td>
          <td th:text="${selectedEvent.getLocation}">2025/12/11</td>
          <td th:text="${selectedEvent.getParticipantCount}">2025/12/11</td>
          <td th:text="${selectedEvent.getCapacity}">2025/12/12</td>
          <td th:text="${selectedEvent.getDescription}">2025/12/12</td>
        </tr>
      </tbody>
    </table>
    
    <div class="button">
    <button type="submit" name="userAction" value="join" id="join" onclick="return confirmJoin()">イベントに入る</button>
    <button type="submit" name="userAction" value="leave" id="leave" onclick="return confirmLeave()">イベントに出る</button></div>
    <div  th:if="${notCreatorError}" th:text="${notCreatorError}" class="error">エラーメッセージ</div>
    </form>

    </div>

    <form action="eventList" method="get">
        <button>戻る</button>
    </form>

</body>









</html>
